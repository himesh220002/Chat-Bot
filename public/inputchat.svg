<!-- sample rectangle -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Definitions for clipping mask and glowing effects -->
  <defs>
    <!-- Clip path to cut the top-left and bottom-right corners by 45 degrees (40px) -->
    <clipPath id="corner-cut-clip">
      <polygon points="40,0 400,0 400,360 360,400 0,400 0,40" />
    </clipPath>
    
    <!-- Neon glow filter for the cyan accents -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Group wrapped in the clip path so all background elements respect the cut corners -->
  <g clip-path="url(#corner-cut-clip)">
    <!-- Base Background Color -->
    <rect width="400" height="400" fill="#01030d" />
    
    <!-- Subtle background grid/glow lines to enhance the Valorant/HUD aesthetic -->
    <path d="M 0,40 L 40,0 M 360,400 L 400,360" stroke="#00E5FF" stroke-width="2" opacity="0.3" />
    <line x1="0" y1="200" x2="400" y2="200" stroke="#ffffff" stroke-width="1" opacity="0.05" />
    <line x1="200" y1="0" x2="200" y2="400" stroke="#ffffff" stroke-width="1" opacity="0.05" />

    <!-- Core HUD Graphics Group -->
    <g transform="translate(200, 200)">
      <!-- 4 Arc Quadrants -->
      <path d="M 50 -150 A 160 160 0 0 1 150 -50" fill="none" stroke="#FF0500" stroke-width="20" stroke-linecap="butt"/>
      <path d="M 150 50 A 160 160 0 0 1 50 150" fill="none" stroke="#FF0500" stroke-width="20" stroke-linecap="butt"/>
      <path d="M -50 150 A 160 160 0 0 1 -150 50" fill="none" stroke="#FF0500" stroke-width="20" stroke-linecap="butt"/>
      <path d="M -150 -50 A 160 160 0 0 1 -50 -150" fill="none" stroke="#FF0500" stroke-width="20" stroke-linecap="butt"/>
      
      <!-- Floating Arrow Darts with added subtle glow matrix -->
      <g filter="url(#cyan-glow)">
        <polygon points="0,-140 -9,-180 0,-188 9,-180" fill="#00E5FF"/>
        <polygon points="0,140 -9,180 0,188 9,180" fill="#00E5FF"/>
        <polygon points="-140,0 -180,-9 -188,0 -180,9" fill="#00E5FF"/>
        <polygon points="140,0 180,-9 188,0 180,9" fill="#00E5FF"/>
        
        <!-- Artistic 'I' Floating Diamond Node -->
        <polygon points="44,-60 56,-42 44,-24 32,-42" fill="#00E5FF"/>
      </g>
      
      <!-- Sharp 'A' Glyph -->
      <path d="M -70 60 L -30 -80 L 10 60 L -10 60 L -30 0 L -50 60 Z" fill="#FFFFFF"/>
      
      <!-- Artistic 'I': Angled Cyber Blade -->
      <polygon points="32,60 56,60 56,-8 32,8" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Outer frame border highlighting the 45-degree sheared edges -->
  <polygon points="40,0 400,0 400,360 360,400 0,400 0,40" fill="none" stroke="#FF0500" stroke-width="3" opacity="0.8" />
</svg>
