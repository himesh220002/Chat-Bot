<!-- Concept 1: Tactical Razor HUD (SVG) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#0B0C10"/>
  <g transform="translate(300, 300)">
    <!-- 4 Arc Quadrants -->
    <path d="M 50 -150 A 160 160 0 0 1 150 -50" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
    <path d="M 150 50 A 160 160 0 0 1 50 150" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
    <path d="M -50 150 A 160 160 0 0 1 -150 50" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
    <path d="M -150 -50 A 160 160 0 0 1 -50 -150" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
    <!-- HUD Framing -->
    <path d="M -195 -160 L -195 -195 L -160 -195" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <path d="M 195 -160 L 195 -195 L 160 -195" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <path d="M -195 160 L -195 195 L -160 195" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <path d="M 195 160 L 195 195 L 160 195" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <!-- Crosshairs & Tapered Darts -->
    <polygon points="0,-210 -8,-185 8,-185" fill="#00E5FF"/>
    <line x1="0" y1="-180" x2="0" y2="-120" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
    <polygon points="0,210 -8,185 8,185" fill="#00E5FF"/>
    <line x1="0" y1="180" x2="0" y2="120" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
    <polygon points="-210,0 -185,-8 -185,8" fill="#00E5FF"/>
    <line x1="-180" y1="0" x2="-120" y2="0" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
    <polygon points="210,0 185,-8 185,8" fill="#00E5FF"/>
    <line x1="180" y1="0" x2="120" y2="0" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
    <!-- AI Monogram -->
    <path d="M -70 60 L -30 -60 L 10 60 L -10 60 L -30 0 L -50 60 Z" fill="#FFFFFF"/>
    <path d="M 30 40 L 52 60 L 70 60 L 70 -60 L 48 -60 L 48 40 Z" fill="#FFFFFF"/>
  </g>
</svg>
